<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصندوق المشترك</title>
<meta name="theme-color" content="#185fa5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root{--bg:#e6f1fb;--card:#fff;--tx:#1f1f1d;--mu:#6b6a65;--bd:#e2e0d9;--ac:#185fa5;--ok:#3b6d11;--ko:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#16212d;--card:#1e2b3a;--tx:#f1efe8;--mu:#a8b4c2;--bd:#33465a;--ac:#85b7eb;--ok:#97c459;--ko:#f09595}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
main{padding:16px}
h2{font-size:18px;font-weight:500;margin:0 0 12px}
h3{font-size:15px;font-weight:500;margin:20px 0 6px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.cards{display:flex;gap:8px;margin-bottom:12px}
.m{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center}
.m b{display:block;font-size:17px;font-weight:500}
.m span{font-size:12px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}
.row:first-child{border-top:none}
small{display:block;font-size:12px;color:var(--mu)}
.in{color:var(--ok)}.out{color:var(--ko)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
input[readonly]{background:var(--bg)}
button{font-family:inherit;font-size:16px;padding:11px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.main{width:100%;margin-top:16px;background:var(--ac);color:#fff;border-color:var(--ac)}
button.link{border:none;background:none;color:var(--ac);padding:4px 8px;font-size:14px}
.err{color:var(--ko);font-size:13px;min-height:18px;margin-top:8px}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:none;border-radius:0;font-size:13px;padding:14px 2px;color:var(--mu);background:none}
nav button.on{color:var(--ac);font-weight:500;border-top:2px solid var(--ac);padding-top:12px}
.empty{color:var(--mu);font-size:14px;padding:10px 0}
.m.g{background:rgba(99,153,34,.15)}.m.r{background:rgba(226,75,74,.15)}.m.b{background:rgba(55,138,221,.15)}
header{background:#185fa5;color:#fff;border:none}header button.link{color:#fff}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar div{height:100%;border-radius:5px}
.lg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px}
.row2{display:flex;gap:8px;margin-top:8px;width:100%}.row2 button{flex:1;padding:8px}.row2 button.ok{background:#3b6d11;color:#fff;border-color:#3b6d11}
.hero{background:#185fa5;color:#fff;text-align:center;padding:32px 16px 60px;border-radius:0 0 28px 28px}.hero h1{font-size:22px;font-weight:500;margin:10px 0 4px}.hero p{margin:0;font-size:14px;opacity:.9}.auth{margin-top:-36px}
.demo{background:rgba(239,159,39,.2);color:var(--tx);border-radius:8px;padding:10px;font-size:13px;margin-bottom:6px}.codeshow{font-weight:500;font-size:16px;letter-spacing:3px;direction:ltr;display:inline-block}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#a32d2d;color:#fff;padding:10px 16px;border-radius:8px;z-index:9;font-size:14px}
</style>

<script>
const MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
let db={members:[],contribs:[],expenses:[]},session=null,tab='home',curMonth=monthKey(Date.now());

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('en-US')+' د';
function pad(n){return String(n).padStart(2,'0')}
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function fmtDate(ts){const d=new Date(ts);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+' · '+pad(d.getHours())+':'+pad(d.getMinutes())}
function monthLabel(k){const p=k.split('-');return MONTHS[Number(p[1])-1]+' '+p[0]}
const nameOf=id=>(db.members.find(m=>m.id===id)||{name:'—'}).name;
const sum=a=>a.reduce((s,x)=>s+x.amount,0);
const cur=()=>db.members.find(m=>m.id===session);
const err=t=>{const e=$('#err');if(e)e.textContent=t};


const LOGO=function(sz){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 64 64" aria-hidden="true" style="display:block"><rect x="2" y="2" width="60" height="60" rx="16" fill="#ffffff" fill-opacity=".14"/><circle cx="30" cy="34" r="20" fill="#fac775" stroke="#ba7517" stroke-width="2"/><circle cx="30" cy="34" r="15" fill="none" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="2 2"/><text x="30" y="43" text-anchor="middle" font-size="22" font-weight="500" fill="#854f0b">$</text><path d="M44 16 L53 7 M46 7 L53 7 L53 14" stroke="#fff3d6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const PAL=['#378add','#1d9e75','#d85a30','#7f77dd','#ba7517','#d4537e','#639922','#888780'];
function num(v){v=String(v).trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫|,/g,'.');return Number(v)}
function legend(a){return '<div class="lg">'+a.map(function(x){return '<span><i style="background:'+x[0]+'"></i>'+x[1]+'</span>'}).join('')+'</div>'}
function donut(total,part,lab,c1,c2,l1,l2){
  const r=42,C=2*Math.PI*r,sp=total>0?Math.max(0,Math.min(part/total,1)):0,pct=Math.round(sp*100);
  return '<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="'+lab+'"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+(total>0?c1:'#b4b2a9')+'" stroke-width="14"/>'+
  (sp>0?'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+c2+'" stroke-width="14" stroke-dasharray="'+(C*sp).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>':'')+
  '<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="500" style="fill:var(--tx)">'+pct+'%</text><text x="60" y="76" text-anchor="middle" font-size="10" style="fill:var(--mu)">'+lab+'</text></svg>'+
  legend([[c1,l1],[c2,l2]]);
}
function memberBars(){
  const data=db.members.map(function(m,k){return{n:m.name,v:sum(okC().filter(function(c){return c.memberId===m.id})),c:PAL[k%PAL.length]}});
  const mx=Math.max.apply(null,data.map(function(d){return d.v}).concat([1]));
  return data.map(function(d){return '<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+esc(d.n)+'</span><b>'+money(d.v)+'</b></div><div class="bar"><div style="width:'+Math.round(d.v/mx*100)+'%;background:'+d.c+'"></div></div></div>'}).join('');
}
function monthChart(fi,fo,li,lo){
  const now=new Date(),ms=[];
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),lab:pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)})}
  ms.forEach(function(m){m.i=fi(m.key);m.o=Math.max(0,fo(m.key))});
  const mx=Math.max.apply(null,ms.map(function(m){return Math.max(m.i,m.o)}).concat([1]));
  let t='<svg viewBox="0 0 300 150" width="100%" role="img" aria-label="'+li+' و'+lo+' حسب الشهر">';
  ms.forEach(function(m,k){
    const x=(5-k)*50+8,hi=Math.round(m.i/mx*100),ho=Math.round(m.o/mx*100);
    t+='<rect x="'+x+'" y="'+(115-hi)+'" width="16" height="'+hi+'" rx="3" fill="#639922"><title>'+money(m.i)+'</title></rect>';
    t+='<rect x="'+(x+18)+'" y="'+(115-ho)+'" width="16" height="'+ho+'" rx="3" fill="#e24b4a"><title>'+money(m.o)+'</title></rect>';
    t+='<text x="'+(x+17)+'" y="135" text-anchor="middle" font-size="10" style="fill:var(--mu)">'+m.lab+'</text>';
  });
  t+='<line x1="0" y1="115" x2="300" y2="115" style="stroke:var(--bd)"/></svg>';
  return t+legend([['#639922',li],['#e24b4a',lo]]);
}

function okC(){return db.contribs.filter(function(c){return !c.status||c.status==='ok'})}
function pendN(){return db.contribs.filter(function(c){return c.status==='pending'}).length}
function banner(me){const n=pendN();return (me.role==='admin'&&n)?'<div class="card" style="border-color:var(--ko)"><b>'+n+' مساهمة في انتظار تأكيدك</b><button class="main" style="margin-top:10px" onclick="go(\'admin\')">مراجعة</button></div>':''}
function pendingBox(){
  const pend=db.contribs.filter(function(c){return c.status==='pending'}).sort(function(a,b){return a.ts-b.ts});
  return '<h3 style="margin-top:0">مساهمات في الانتظار</h3><div class="card">'+(pend.length?pend.map(function(c){return '<div class="row" style="flex-direction:column"><div style="display:flex;justify-content:space-between;width:100%"><span>'+esc(nameOf(c.memberId))+'<small>'+fmtDate(c.ts)+'</small>'+(c.comment?'<small>'+esc(c.comment)+'</small>':'')+'</span><b>'+money(c.amount)+'</b></div><div class="row2"><button class="ok" onclick="approve(\''+c.id+'\')">تأكيد</button><button onclick="rejectC(\''+c.id+'\')">رفض</button></div></div>'}).join(''):'<div class="empty">لا توجد مساهمات في الانتظار.</div>')+'</div>';
}
function approve(id){backend.update('contribs',id,{status:'ok'}).catch(function(e){toast(fbMsg(e))})}
function rejectC(id){backend.update('contribs',id,{status:'rejected'}).catch(function(e){toast(fbMsg(e))})}

function expOp(e){return{ts:e.ts,kind:e.type==='repay'?'in':'out',label:e.title,amount:e.amount}}
function outSum(a){return a.reduce(function(t,e){return t+(e.type==='repay'?-e.amount:e.amount)},0)}
function debts(){return db.members.map(function(m){return{m:m,v:db.expenses.filter(function(e){return e.memberId===m.id}).reduce(function(t,e){return t+(e.type==='loan'?e.amount:e.type==='repay'?-e.amount:0)},0)}}).filter(function(d){return d.v>0})}
function debtBox(){
  const rows=db.members.map(function(m){
    const ls=db.expenses.filter(function(e){return e.memberId===m.id&&e.type==='loan'}).sort(function(a,b){return a.ts-b.ts});
    const rp=db.expenses.filter(function(e){return e.memberId===m.id&&e.type==='repay'}).reduce(function(t,e){return t+e.amount},0);
    const lent=ls.reduce(function(t,e){return t+e.amount},0);
    return{m:m,ls:ls,left:lent-rp};
  }).filter(function(x){return x.left>0});
  const t=rows.reduce(function(a,x){return a+x.left},0);
  return '<h3>السلف</h3><div class="card">'+(rows.length?rows.map(function(x){
    return '<div class="row" style="flex-direction:column"><div style="display:flex;justify-content:space-between;width:100%"><b>'+esc(x.m.name)+'</b>'+'<b class="out">متبقي '+money(x.left)+'</b>'+'</div>'+x.ls.map(function(e){return '<small>اقترض '+money(e.amount)+' · '+fmtDate(e.ts)+'</small>'}).join('')+'</div>';
  }).join('')+'<div class="row"><span>المتبقي عند الأعضاء</span><b>'+money(t)+'</b></div>':'<div class="empty">لا توجد سلف غير مسترجعة.</div>')+'</div>';
}
function repayCard(){
  const d=debts();
  return '<div class="card"><h3 style="margin-top:0">إرجاع سلفة</h3>'+(d.length?'<label>العضو</label><select id="rm">'+d.map(function(x){return '<option value="'+x.m.id+'">'+esc(x.m.name)+' (متبقي '+money(x.v)+')</option>'}).join('')+'</select><label>المبلغ المرجع بالدرهم</label><input id="ra" type="text" inputmode="decimal"><div class="err" id="err3"></div><button class="main" style="margin-top:8px" onclick="addRepay()">تسجيل الإرجاع</button>':'<div class="empty">لا توجد سلف غير مسترجعة.</div>')+'</div>';
}
function addRepay(){
  const id=$('#rm').value,a=num($('#ra').value),d=debts().find(function(x){return x.m.id===id});
  if(!(a>0))return $('#err3').textContent='أدخل مبلغا صحيحا';
  if(!d||a>d.v)return $('#err3').textContent='المبلغ أكبر من السلفة المتبقية ('+money(d?d.v:0)+')';
  backend.add('expenses',{type:'repay',title:'إرجاع سلفة من '+nameOf(id),memberId:id,amount:a,ts:Date.now()}).then(render).catch(fail('err3'));
}
function ops(list){
  const a=list.contribs.map(c=>({ts:c.ts,kind:'in',label:'مساهمة '+nameOf(c.memberId),amount:c.amount,comment:c.comment}));
  const b=list.expenses.map(expOp);
  return a.concat(b).sort((x,y)=>y.ts-x.ts);
}
function opRow(o){
  return '<div class="row"><div><span class="'+o.kind+'">'+(o.kind==='in'?'↓':'↑')+'</span> '+esc(o.label)+'<small>'+fmtDate(o.ts)+'</small>'+(o.comment?'<small>'+esc(o.comment)+'</small>':'')+'</div><b>'+money(o.amount)+'</b></div>';
}

let boot='loading',mode='login',signing=false,dirty=false;
function latin(v){return String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function ph(v){return latin(v).replace(/\D/g,'').replace(/^00212/,'0').replace(/^212/,'0')}
function hero(t,sub){
  return '<div class="hero">'+LOGO(72)+'<h1>'+t+'</h1><p>'+sub+'</p></div>';
}
function fbMsg(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'رقم الهاتف أو كلمة المرور غير صحيحة';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة. جرب بعد قليل.';
  if(c==='auth/network-request-failed'||c==='unavailable')return 'لا يوجد اتصال بالإنترنت.';
  if(c==='auth/email-already-in-use')return 'هذا الرقم مسجل من قبل';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة (6 أحرف على الأقل)';
  if(c==='permission-denied')return 'ليست لديك صلاحية لهذه العملية';
  return 'وقع خطأ. جرب مرة أخرى.';
}
function fail(id){return function(e){const el=$('#'+id);if(el)el.textContent=fbMsg(e)}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3500)}

const EM='@caisse.app';
function emailOf(p){return ph(p)+EM}
let FAUTH=null,FS=null,unsubs=[];
const backend={
  init:function(){firebase.initializeApp(FIREBASE_CONFIG);FAUTH=firebase.auth();FS=firebase.firestore()},
  onAuth:function(cb){FAUTH.onAuthStateChanged(cb)},
  current:function(){return FAUTH.currentUser},
  login:function(p,pw){return FAUTH.signInWithEmailAndPassword(emailOf(p),pw)},
  logout:function(){return FAUTH.signOut()},
  getUser:function(id){return FS.collection('users').doc(id).get()},
  adminExists:function(){return FS.collection('meta').doc('admin').get().then(function(s){return s.exists})},
  signupAdmin:async function(n,p,pw){
    const cred=await FAUTH.createUserWithEmailAndPassword(emailOf(p),pw),id=cred.user.uid;
    try{
      const b=FS.batch();
      b.set(FS.collection('meta').doc('admin'),{uid:id,ts:Date.now()});
      b.set(FS.collection('users').doc(id),{name:n,phone:p,role:'admin'});
      await b.commit();
    }catch(e){try{await cred.user.delete()}catch(x){}throw e}
  },
  addMember:async function(n,p,pw){
    const sec=firebase.apps.find(function(a){return a.name==='sec'})||firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const sa=sec.auth(),cred=await sa.createUserWithEmailAndPassword(emailOf(p),pw),id=cred.user.uid;
    try{await FS.collection('users').doc(id).set({name:n,phone:p,role:'member'})}
    catch(e){try{await cred.user.delete()}catch(x){}try{await sa.signOut()}catch(x){}throw e}
    await sa.signOut();
  },
  add:function(c,o){return FS.collection(c).add(o)},
  update:function(c,id,o){return FS.collection(c).doc(id).update(o)},
  start:function(on,onErr){
    ['users','contribs','expenses'].forEach(function(c){
      unsubs.push(FS.collection(c).onSnapshot(function(snap){
        on(c==='users'?'members':c,snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}));
      },onErr));
    });
  },
  stop:function(){unsubs.forEach(function(f){f()});unsubs=[]}
};

function onAuth(user){
  if(signing)return;
  backend.stop();db={members:[],contribs:[],expenses:[]};session=null;tab='home';
  if(!user){boot='out';render();return}
  boot='loading';render();
  backend.getUser(user.uid).then(function(s){
    if(s.exists){
      session=user.uid;boot='ready';
      backend.start(function(n,a){db[n]=a;refresh()},function(){boot='out';backend.logout()});
      render();
    }else{boot='nouser';render()}
  }).catch(function(){boot='nouser';render()});
}
function refresh(){
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){dirty=true;return}
  render();
}
document.addEventListener('focusout',function(){
  if(!dirty)return;
  setTimeout(function(){const a=document.activeElement;if(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){dirty=false;render()}},250);
});

function configView(){
  return hero('الصندوق المشترك','خطوة أخيرة قبل الاستعمال')+'<main class="auth"><div class="card"><p style="margin-top:0">لم تتم إضافة إعدادات Firebase بعد. افتح الملف وعوض القيم داخل <b>FIREBASE_CONFIG</b> ثم أعد تحميل الصفحة.</p></div></main>';
}
function loadingView(){
  return hero('الصندوق المشترك','جار التحميل…')+'<main class="auth"><div class="card"><p class="note" style="margin:0;text-align:center">لحظة من فضلك</p></div></main>';
}
function nouserView(){
  return hero('الصندوق المشترك','حسابك غير مفعل')+'<main class="auth"><div class="card"><p class="note" style="margin-top:0">هذا الرقم غير مسجل عند الأدمن. تواصل معه ليضيفك.</p><button class="main" onclick="logout()">رجوع</button></div></main>';
}
function setupView(){
  return hero('الصندوق المشترك','إنشاء حساب الأدمن')+'<main class="auth"><div class="card"><p class="note" style="margin-top:0">يُنشأ هذا الحساب مرة واحدة فقط. هو يتحكم في المصاريف والسلف ويضيف الأعضاء.</p>'+
  '<label>الاسم</label><input id="n"><label>رقم الهاتف</label><input id="p" type="tel" inputmode="numeric"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="c" type="password">'+
  '<div class="err" id="err"></div><button class="main" onclick="createAdmin()">إنشاء الحساب</button><button class="link" style="width:100%;margin-top:8px" onclick="mode=\'login\';render()">رجوع لتسجيل الدخول</button></div></main>';
}
function createAdmin(){
  const n=$('#n').value.trim(),p=ph($('#p').value),c=$('#c').value;
  if(!n||!p)return err('أدخل الاسم ورقم الهاتف');
  if(c.length<6)return err('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  err('جار الإنشاء…');signing=true;
  backend.signupAdmin(n,p,c).then(function(){signing=false;onAuth(backend.current())}).catch(function(e){
    signing=false;
    err((e&&e.code==='permission-denied')?'الأدمن موجود مسبقا. سجل دخولك.':fbMsg(e));
  });
}
function loginView(){
  return hero('الصندوق المشترك','سجل دخولك برقم هاتفك وكلمة المرور')+'<main class="auth"><div class="card"><label style="margin-top:0">رقم الهاتف</label><input id="p" type="tel" inputmode="numeric" placeholder="06XXXXXXXX"><label>كلمة المرور</label><input id="c" type="password">'+
  '<div class="err" id="err"></div><button class="main" onclick="login()">دخول</button><button class="link" style="width:100%;margin-top:8px" onclick="mode=\'setup\';render()">أول استعمال؟ إنشاء حساب الأدمن</button></div></main>';
}
function login(){
  const p=ph($('#p').value),c=$('#c').value;
  if(!p||!c)return err('أدخل رقم الهاتف وكلمة المرور');
  err('جار الدخول…');
  backend.login(p,c).catch(function(e){err(fbMsg(e))});
}
function logout(){backend.logout()}

function inM(a,k){return a.filter(function(x){return monthKey(x.ts)===k})}
function bef(a,k){return a.filter(function(x){return monthKey(x.ts)<k})}
function prevKey(k){const p=k.split('-'),d=new Date(Number(p[0]),Number(p[1])-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function cBal(k){return sum(bef(okC(),k))-outSum(bef(db.expenses,k))}
function cards3(a,la,b,lb,c,lc){return '<div class="cards"><div class="m g"><b class="in">'+money(a)+'</b><span>'+la+'</span></div><div class="m r"><b class="out">'+money(b)+'</b><span>'+lb+'</span></div><div class="m b"><b style="color:var(--ac)">'+money(c)+'</b><span>'+lc+'</span></div></div>'}
function listBox(arr,empty){return '<div class="card">'+(arr.length?arr.map(opRow).join(''):'<div class="empty">'+empty+'</div>')+'</div>'}
function homeView(me){
  const i=sum(okC()),o=outSum(db.expenses),mk=monthKey(Date.now()),list=ops({contribs:inM(okC(),mk),expenses:inM(db.expenses,mk)});
  return banner(me)+cards3(i,'الداخل',o,'الخارج',i-o,'المتبقي')+
  debtBox()+'<h3>نسبة المصروف</h3><div class="card" style="text-align:center">'+donut(i,o,'مصروف','#639922','#e24b4a','المتبقي','المصروف')+'</div>'+
  '<h3>مساهمات الأعضاء</h3><div class="card">'+memberBars()+'</div>'+
  '<h3>آخر 6 أشهر</h3><div class="card">'+monthChart(function(k){return sum(inM(okC(),k))},function(k){return outSum(inM(db.expenses,k))},'الداخل','الخارج')+'</div>'+
  '<h3>آخر العمليات · '+monthLabel(mk)+'</h3>'+listBox(list,'لا توجد عمليات فهاد الشهر بعد.');
}
function monthView(){
  if(!curMonth)curMonth=monthKey(Date.now());
  const k=curMonth,op=cBal(k),cs=inM(okC(),k),es=inM(db.expenses,k),i=sum(cs)+sum(es.filter(function(e){return e.type==='repay'})),o=sum(es.filter(function(e){return e.type!=='repay'}));
  return '<label style="margin-top:0">الشهر</label><input type="month" value="'+k+'" onchange="curMonth=this.value;render()">'+
  '<div class="card" style="margin-top:14px"><div class="row"><span>فالصندوق من الشهر السابق ('+monthLabel(prevKey(k))+')</span><b>'+money(op)+'</b></div></div>'+
  cards3(i,'الداخل هاد الشهر',o,'الخارج هاد الشهر',op+i-o,'فالصندوق دابا')+
  '<h3>المساهمات</h3>'+listBox(cs.sort(function(a,b){return b.ts-a.ts}).map(function(c){return{ts:c.ts,kind:'in',label:nameOf(c.memberId),amount:c.amount,comment:c.comment}}),'لا توجد مساهمات في هذا الشهر.')+
  '<h3>المصاريف والسلف والإرجاع</h3>'+listBox(es.sort(function(a,b){return b.ts-a.ts}).map(expOp),'لا توجد مصاريف في هذا الشهر.');
}
function payView(me){
  const k=monthKey(Date.now());
  const mine=db.contribs.find(c=>c.memberId===me.id&&c.status!=='rejected'&&monthKey(c.ts)===k);
  const rej=db.contribs.some(c=>c.memberId===me.id&&c.status==='rejected'&&monthKey(c.ts)===k);
  const t='<h2>مساهمة شهر '+monthLabel(k)+'</h2>';
  if(mine)return t+'<div class="card"><label style="margin-top:0">اسم المساهم</label><input value="'+esc(me.name)+'" readonly><label>المبلغ</label><input value="'+mine.amount+'" readonly><label>التعليق</label><input value="'+esc(mine.comment||'')+'" readonly><p class="note">سجلت في '+fmtDate(mine.ts)+'. لا يمكن تعديلها.</p>'+(mine.status==='pending'?'<p class="note" style="color:var(--ko)">في انتظار تأكيد الأدمن. لن تظهر في لوحة القيادة قبل تأكيدها.</p>':'<p class="note" style="color:var(--ok)">أكدها الأدمن وظهرت في لوحة القيادة.</p>')+'</div>';
  return t+'<div class="card">'+(rej?'<p class="note" style="color:var(--ko);margin:0 0 8px">رفض الأدمن مساهمتك السابقة. يمكنك إرسال مساهمة جديدة.</p>':'')+'<label style="margin-top:0">اسم المساهم</label><input value="'+esc(me.name)+'" readonly><label>المبلغ بالدرهم</label><input id="amt" type="text" inputmode="decimal" placeholder="500"><label>تعليق (اختياري)</label><input id="cmt" placeholder="أضف ملاحظة">'+
  '<div class="err" id="err"></div><button class="main" onclick="pay()">تأكيد المساهمة</button><div id="cf"></div><p class="note">بعد التأكيد لا يمكن تعديل المبلغ ولا التعليق.</p></div>';
}
function pay(){
  const a=num($('#amt').value);
  if(!(a>0))return err('أدخل مبلغا صحيحا');
  err('');
  $('#cf').innerHTML='<div class="card" style="border-color:var(--ac);margin:14px 0 0"><b>'+money(a)+'</b><p class="note">بعد التأكيد لا يمكن تعديل المبلغ ولا التعليق. هل تريد المتابعة؟</p><button class="main" style="margin-top:10px" onclick="doPay()">نعم، أؤكد</button><button style="width:100%;margin-top:8px" onclick="$(\'#cf\').innerHTML=\'\'">رجوع</button></div>';
}
function doPay(){
  const me=cur(),a=num($('#amt').value),c=$('#cmt').value.trim();
  if(!(a>0)||!me)return;
  $('#cf').innerHTML='<p class="note">جار الحفظ…</p>';
  backend.add('contribs',{memberId:me.id,amount:a,comment:c,ts:Date.now(),status:me.role==='admin'?'ok':'pending'}).then(function(){tab=me.role==='admin'?'home':'pay';render();window.scrollTo(0,0)}).catch(function(e){$('#cf').innerHTML='<div class="err">'+fbMsg(e)+'</div>'});
}
function membersView(me){
  const rows=db.members.map(m=>'<div class="row"><div>'+esc(m.name)+(m.role==='admin'?' <small style="display:inline">(أدمن)</small>':'')+(me.role==='admin'?'<small>'+esc(m.phone)+'</small>':'')+'</div><b>'+money(sum(okC().filter(c=>c.memberId===m.id)))+'</b></div>').join('');
  let form='';
  if(me.role==='admin')form='<h3>إضافة عضو</h3><div class="card"><label style="margin-top:0">الاسم</label><input id="n"><label>رقم الهاتف</label><input id="p" type="tel" inputmode="numeric"><label>كلمة مرور مؤقتة (6 أحرف على الأقل)</label><input id="c" type="text"><div class="err" id="err"></div><button class="main" onclick="addMember()">إضافة</button></div>';
  return '<h2>الأعضاء</h2><div class="card">'+rows+'</div>'+form;
}
function addMember(){
  const n=$('#n').value.trim(),p=ph($('#p').value),c=$('#c').value;
  if(!n||!p)return err('أدخل الاسم ورقم الهاتف');
  if(c.length<6)return err('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(db.members.some(function(m){return ph(m.phone)===p}))return err('هذا الرقم مسجل من قبل');
  err('جار الإضافة…');
  backend.addMember(n,p,c).then(render).catch(function(e){err(fbMsg(e))});
}
function adminView(){
  const k=monthKey(Date.now()),list=db.expenses.filter(e=>monthKey(e.ts)===k).sort((a,b)=>b.ts-a.ts);
  return '<h2>الإدارة</h2>'+pendingBox()+'<div class="card"><h3 style="margin-top:0">تسجيل مصروف</h3><label>البيان</label><input id="et" placeholder="شراء مستلزمات"><label>المبلغ بالدرهم</label><input id="ea" type="text" inputmode="decimal"><div class="err" id="err1"></div><button class="main" style="margin-top:8px" onclick="addExpense()">إضافة مصروف</button></div>'+
  '<div class="card"><h3 style="margin-top:0">سلفة الشهر</h3><label>العضو</label><select id="lm">'+db.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select><label>المبلغ بالدرهم</label><input id="la" type="text" inputmode="decimal"><div class="err" id="err2"></div><button class="main" style="margin-top:8px" onclick="addLoan()">تسجيل السلفة</button></div>'+
  repayCard()+'<h3>مصاريف وسلف هذا الشهر</h3><div class="card">'+(list.length?list.map(e=>opRow(expOp(e))).join(''):'<div class="empty">لا توجد مصاريف بعد.</div>')+'</div>';
}
function addExpense(){
  const t=$('#et').value.trim(),a=num($('#ea').value);
  if(!t)return $('#err1').textContent='أدخل البيان';
  if(!(a>0))return $('#err1').textContent='أدخل مبلغا صحيحا';
  backend.add('expenses',{type:'expense',title:t,amount:a,ts:Date.now()}).then(render).catch(fail('err1'));
}
function addLoan(){
  const id=$('#lm').value,a=num($('#la').value);
  if(!(a>0))return $('#err2').textContent='أدخل مبلغا صحيحا';
  backend.add('expenses',{type:'loan',title:'سلفة لـ '+nameOf(id),memberId:id,amount:a,ts:Date.now()}).then(render).catch(fail('err2'));
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function render(){
  const el=$('#app');
  if(!FIREBASE_CONFIG.apiKey){el.innerHTML=configView();return}
  if(boot==='loading'){el.innerHTML=loadingView();return}
  if(boot==='out'){el.innerHTML=mode==='setup'?setupView():loginView();return}
  if(boot==='nouser'){el.innerHTML=nouserView();return}
  const me=cur();
  if(!me){el.innerHTML=loadingView();return}
  const tabs=[['home','الرئيسية'],['month','الشهر'],['pay','المساهمة'],['members','الأعضاء']];
  if(me.role==='admin')tabs.push(['admin','الإدارة'+(pendN()?' ('+pendN()+')':'')]);
  if(!tabs.some(t=>t[0]===tab))tab='home';
  const views={home:homeView,month:monthView,pay:payView,members:membersView,admin:adminView};
  el.innerHTML='<header><span style="display:flex;align-items:center;gap:8px">'+LOGO(28)+'<b>الصندوق المشترك</b></span><button class="link" onclick="logout()">خروج ('+esc(me.name)+')</button></header><main>'+views[tab](me)+'</main><nav>'+tabs.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</nav>';
}
if(FIREBASE_CONFIG.apiKey){backend.init();backend.onAuth(onAuth)}
render();
</script>
</body>
</html>
