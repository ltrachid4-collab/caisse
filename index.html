<style>
:root{--bg:#e6f1fb;--card:#fff;--tx:#1f1f1d;--mu:#6b6a65;--bd:#e2e0d9;--ac:#185fa5;--ok:#3b6d11;--ko:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#16212d;--card:#1e2b3a;--tx:#f1efe8;--mu:#a8b4c2;--bd:#33465a;--ac:#85b7eb;--ok:#97c459;--ko:#f09595}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
main{padding:16px}
h2{font-size:18px;font-weight:500;margin:0 0 12px}
h3{font-size:15px;font-weight:500;margin:20px 0 6px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.cards{display:flex;gap:8px;margin-bottom:12px}
.m{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center}
.m b{display:block;font-size:17px;font-weight:500}
.m span{font-size:12px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}
.row:first-child{border-top:none}
small{display:block;font-size:12px;color:var(--mu)}
.in{color:var(--ok)}.out{color:var(--ko)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
input[readonly]{background:var(--bg)}
button{font-family:inherit;font-size:16px;padding:11px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.main{width:100%;margin-top:16px;background:var(--ac);color:#fff;border-color:var(--ac)}
button.link{border:none;background:none;color:var(--ac);padding:4px 8px;font-size:14px}
.err{color:var(--ko);font-size:13px;min-height:18px;margin-top:8px}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:none;border-radius:0;font-size:13px;padding:14px 2px;color:var(--mu);background:none}
nav button.on{color:var(--ac);font-weight:500;border-top:2px solid var(--ac);padding-top:12px}
.empty{color:var(--mu);font-size:14px;padding:10px 0}
.m.g{background:rgba(99,153,34,.15)}.m.r{background:rgba(226,75,74,.15)}.m.b{background:rgba(55,138,221,.15)}
header{background:#185fa5;color:#fff;border:none}header button.link{color:#fff}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar div{height:100%;border-radius:5px}
.lg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px}
.row2{display:flex;gap:8px;margin-top:8px;width:100%}.row2 button{flex:1;padding:8px}.row2 button.ok{background:#3b6d11;color:#fff;border-color:#3b6d11}
.hero{background:#185fa5;color:#fff;text-align:center;padding:32px 16px 60px;border-radius:0 0 28px 28px}.hero h1{font-size:22px;font-weight:500;margin:10px 0 4px}.hero p{margin:0;font-size:14px;opacity:.9}.auth{margin-top:-36px}
.demo{background:rgba(239,159,39,.2);color:var(--tx);border-radius:8px;padding:10px;font-size:13px;margin-bottom:6px}.codeshow{font-weight:500;font-size:16px;letter-spacing:3px;direction:ltr;display:inline-block}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#a32d2d;color:#fff;padding:10px 16px;border-radius:8px;z-index:9;font-size:14px}

let editKey=null,delKey=null;

function askDel(k){delKey=k;render()}
function fixView(){
  const cs=okC().slice().sort(function(a,b){return b.ts-a.ts}).slice(0,40);
  const ex=db.expenses.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,40);

  h+='<div class="card"><b>المساهمات المؤكدة (آخر 40)</b>'+(cs.length?cs.map(function(c){
    const k='c:'+c.id;
    if(editKey===k)return '<div class="row" style="flex-direction:column"><b>'+esc(nameOf(c.memberId))+'</b><label>المبلغ بالدرهم</label><input id="ee" type="text" value="'+c.amount+'"><label>تعليق</label><input id="ec" value="'+esc(c.comment||'')+'"><div class="err" id="err4"></div><div class="row2"><button class="ok" onclick="saveContrib(\''+c.id+'\')">حفظ</button><button onclick="editKey=null;render()">إلغاء</button></div></div>';
    return '<div class="row"><div>'+esc(nameOf(c.memberId))+'<small>'+fmtDate(c.ts)+'</small>'+(c.paidTs?'<small>دفع فعليا: '+fmtDay(c.paidTs)+'</small>':'')+(c.comment?'<small>'+esc(c.comment)+'</small>':'')+'</div><div style="text-align:left"><b>'+money(c.amount)+'</b><div class="row2"><button onclick="editKey=\''+k+'\';render()">تعديل</button><button onclick="backToPending(\''+c.id+'\')">للانتظار</button>'+delBtn(k,'deleteContrib(\''+c.id+'\')')+'</div></div></div>';
  }).join(''):'<div class="empty">لا توجد مساهمات.</div>')+'</div>';
  h+='<div class="card"><b>المصاريف والسلف (آخر 40)</b>'+(ex.length?ex.map(function(e){
    const k='e:'+e.id;
    return '<div class="row"><div>'+esc(e.title)+'<small>'+fmtDate(e.ts)+'</small></div><div style="text-align:left"><b>'+money(e.amount)+'</b><div class="row2">'+delBtn(k,'deleteExp(\''+e.id+'\')')+'</div></div></div>';
  }).join(''):'<div class="empty">لا توجد مصاريف.</div>')+'</div>';

    const k='m:'+m.id;
    if(editKey===k)return '<div class="row" style="flex-direction:column"><label style="margin-top:0">الاسم</label><input id="en" value="'+esc(m.name)+'"><small>رقم الهاتف ما يتبدلش. لتغييره، احذف العضو وزيده من جديد.</small><div class="row2"><button class="ok" onclick="saveMember(\''+m.id+'\')">حفظ</button><button onclick="editKey=null;render()">إلغاء</button></div></div>';

function saveContrib(id){const a=num($('#ee').value),c=$('#ec').value.trim();if(!(a>0)){$('#err4').textContent='أدخل مبلغا صحيحا';return}backend.update('contribs',id,{amount:a,comment:c}).then(function(){editKey=null;render()}).catch(function(e){toast(fbMsg(e))})}
function deleteContrib(id){backend.del('contribs',id).then(function(){delKey=null}).catch(function(e){toast(fbMsg(e))})}
function deleteExp(id){backend.del('expenses',id).then(function(){delKey=null}).catch(function(e){toast(fbMsg(e))})}
function saveMember(id){const n=$('#en').value.trim();if(!n){toast('أدخل الاسم');return}backend.update('users',id,{name:n}).then(function(){editKey=null;render()}).catch(function(e){toast(fbMsg(e))})}
function deleteMember(id){backend.del('users',id).then(function(){delKey=null}).catch(function(e){toast(fbMsg(e))})}
const PAL=['#378add','#1d9e75','#d85a30','#7f77dd','#ba7517','#d4537e','#639922','#888780'];
function num(v){v=String(v).trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫|,/g,'.');return Number(v)}
function legend(a){return '<div class="lg">'+a.map(function(x){return '<span><i style="background:'+x[0]+'"></i>'+x[1]+'</span>'}).join('')+'</div>'}
function donut(total,part,lab,c1,c2,l1,l2){
  const r=42,C=2*Math.PI*r,sp=total>0?Math.max(0,Math.min(part/total,1)):0,pct=Math.round(sp*100);
  return '<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="'+lab+'"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+(total>0?c1:'#b4b2a9')+'" stroke-width="14"/>'+
  (sp>0?'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+c2+'" stroke-width="14" stroke-dasharray="'+(C*sp).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>':'')+
  '<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="500" style="fill:var(--tx)">'+pct+'%</text><text x="60" y="76" text-anchor="middle" font-size="10" style="fill:var(--mu)">'+lab+'</text></svg>'+
  legend([[c1,l1],[c2,l2]]);
}

  const mx=Math.max.apply(null,data.map(function(d){return d.v}).concat([1]));

function monthChart(fi,fo,li,lo){
  const now=new Date(),ms=[];
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),lab:pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)})}
  ms.forEach(function(m){m.i=fi(m.key);m.o=Math.max(0,fo(m.key))});
  const mx=Math.max.apply(null,ms.map(function(m){return Math.max(m.i,m.o)}).concat([1]));
  let t='<svg viewBox="0 0 300 150" width="100%" role="img" aria-label="'+li+' و'+lo+' حسب الشهر">';
  ms.forEach(function(m,k){
    const x=(5-k)*50+8,hi=Math.round(m.i/mx*100),ho=Math.round(m.o/mx*100);
    t+='<rect x="'+x+'" y="'+(115-hi)+'" width="16" height="'+hi+'" rx="3" fill="#639922"><title>'+money(m.i)+'</title></rect>';
    t+='<rect x="'+(x+18)+'" y="'+(115-ho)+'" width="16" height="'+ho+'" rx="3" fill="#e24b4a"><title>'+money(m.o)+'</title></rect>';
    t+='<text x="'+(x+17)+'" y="135" text-anchor="middle" font-size="10" style="fill:var(--mu)">'+m.lab+'</text>';
  });
  t+='<line x1="0" y1="115" x2="300" y2="115" style="stroke:var(--bd)"/></svg>';
  return t+legend([['#639922',li],['#e24b4a',lo]]);
}

  onAuth:function(cb){FAUTH.onAuthStateChanged(cb)},

  start:function(on,onErr){
    ['users','contribs','expenses','payments'].forEach(function(c){
      unsubs.push(FS.collection(c).onSnapshot(function(snap){
        on(c==='users'?'members':c,snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}));
      },onErr));

  stop:function(){unsubs.forEach(function(f){f()});unsubs=[]}
};

function cBal(k){return sum(bef(okC(),k))-outSum(bef(db.expenses,k))}

  }).join('');
  return '<h2>مساهمة شهر '+monthLabel(k)+'</h2>'+note+
  '<div class="card"><label style="margin-top:0">اسم المساهم</label><input value="'+esc(me.name)+'" readonly><label>المبلغ بالدرهم</label><input id="amt" type="text" inputmode="decimal" placeholder="500"><label>تاريخ الدفع الفعلي</label><input id="pd" type="date" value="'+isoOf(Date.now())+'"><label>تعليق (اختياري)</label><input id="cmt" placeholder="أضف ملاحظة"><div class="err" id="err"></div><button class="main" onclick="pay()">تأكيد المساهمة</button><div id="cf"></div></div>'+
  (list?'<h3>مساهماتي هاد الشهر</h3><div class="card">'+list+'</div>':'');
}
function markSeen(){const me=cur();db.contribs.filter(function(c){return c.memberId===me.id&&c.seen===false&&c.status!=='pending'}).forEach(function(c){backend.update('contribs',c.id,{seen:true}).catch(function(e){toast(fbMsg(e))})})}
function backToPending(id){backend.update('contribs',id,{status:'pending'}).then(function(){editKey=null}).catch(function(e){toast(fbMsg(e))})}
function saveOut(id){
  const p=db.payments.find(function(x){return x.id===id});if(!p)return;
  const a=num($('#oa').value),d=$('#od').value;
  if(!(a>0)||a>Number(p.amount))return toast('أدخل مبلغا صحيحا (ما يتعداش مبلغ الدفعة)');
  if(!d)return toast('اختار تاريخ الخروج');
  backend.update('payments',id,{outAmount:a,outTs:new Date(d+'T12:00:00').getTime()}).then(function(){outKey=null;render()}).catch(function(e){toast(fbMsg(e))})
}
function pay(){
  const a=num($('#amt').value);
  if(!(a>0))return err('أدخل مبلغا صحيحا');
  err('');
  $('#cf').innerHTML='<div class="card" style="border-color:var(--ac);margin:14px 0 0"><b>'+money(a)+'</b><p class="note">بعد التأكيد لا يمكن تعديل المبلغ ولا التعليق. هل تريد المتابعة؟</p><button class="main" style="margin-top:10px" onclick="doPay()">نعم، أؤكد</button><button style="width:100%;margin-top:8px" onclick="$(\'#cf\').innerHTML=\'\'">رجوع</button></div>';
}
function doPay(){
  const me=cur(),a=num($('#amt').value),c=$('#cmt').value.trim(),pdv=$('#pd')?$('#pd').value:'';
  if(!(a>0)||!me)return;
  $('#cf').innerHTML='<p class="note">جار الحفظ…</p>';
  backend.add('contribs',{memberId:me.id,amount:a,comment:c,ts:Date.now(),paidTs:pdv?new Date(pdv+'T12:00:00').getTime():null,status:me.role==='admin'?'ok':'pending'}).then(function(){tab=me.role==='admin'?'home':'pay';render();window.scrollTo(0,0)}).catch(function(e){$('#cf').innerHTML='<div class="err">'+fbMsg(e)+'</div>'});
}
function membersView(me){
  const rows=db.members.filter(m=>m.role!=='admin').map(m=>'<div class="row"><div>'+esc(m.name)+(m.role==='admin'?' <small style="display:inline">(أدمن)</small>':'')+(me.role==='admin'?'<small>'+esc(m.phone)+'</small>':'')+'</div><b>'+money(sum(okC().filter(c=>c.memberId===m.id)))+'</b></div>').join('');
  let form='';
  if(me.role==='admin')form='<h3>إضافة عضو</h3><div class="card"><label style="margin-top:0">الاسم</label><input id="n"><label>رقم الهاتف</label><input id="p" type="tel" inputmode="numeric"><label>كلمة مرور مؤقتة (6 أحرف على الأقل)</label><input id="c" type="text"><div class="err" id="err"></div><button class="main" onclick="addMember()">إضافة</button></div>';
  return '<h2>الأعضاء</h2><div class="card">'+rows+'</div>'+form;
}
function addMember(){
  const n=$('#n').value.trim(),p=ph($('#p').value),c=$('#c').value;
  if(!n||!p)return err('أدخل الاسم ورقم الهاتف');
  if(c.length<6)return err('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(db.members.some(function(m){return ph(m.phone)===p}))return err('هذا الرقم مسجل من قبل');
  err('جار الإضافة…');
  backend.addMember(n,p,c).then(render).catch(function(e){err(fbMsg(e))});
}
function adminBase(){return '<h2>الإدارة</h2>'+pendingBox()}
function opsForms(){return '<div class="card"><h3 style="margin-top:0">تسجيل مصروف</h3><label>البيان</label><input id="et" placeholder="شراء مستلزمات"><label>المبلغ بالدرهم</label><input id="ea" type="text" inputmode="decimal"><div class="err" id="err1"></div><button class="main" style="margin-top:8px" onclick="addExpense()">إضافة مصروف</button></div>'+
  '<div class="card"><h3 style="margin-top:0">سلفة الشهر</h3><label>العضو</label><select id="lm">'+db.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('')+'</select><label>المبلغ بالدرهم</label><input id="la" type="text" inputmode="decimal"><div class="err" id="err2"></div><button class="main" style="margin-top:8px" onclick="addLoan()">تسجيل السلفة</button></div>'+
  repayCard();}
function srcSettings(){
  const sel='<select id="sm_r"><option value="">بلا</option>'+db.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===SRC_RECORDER?' selected':'')+'>'+esc(m.name)+'</option>'}).join('')+'</select>';
  return '<div class="card"><h3 style="margin-top:0">إعدادات الدار آزرو</h3><label>المبلغ الشهري بالدرهم</label><input id="sm_m" type="text" inputmode="decimal" value="'+SRC_MONTHLY+'"><button class="main" style="margin-top:8px" onclick="saveMonthly()">حفظ المبلغ الشهري</button><hr><label>العضو اللي يقدر يسجل الدفعات</label>'+sel+'<button class="main" style="margin-top:8px" onclick="saveRecorder()">حفظ</button></div>';
}
function srcForm(isAdm){
  const s=srcStats(),boxes=[];
  for(let m=1;m<=12;m++){boxes.push('<label style="display:flex;gap:6px;align-items:center;margin:4px 0"><input type="checkbox" class="sm" value="'+srcKey(s.y,m)+'" style="width:auto">'+MONTHS[m-1]+'</label>')}
  const list=db.payments.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,30).map(function(p){
    const head='<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><b>'+money(p.amount)+'</b> · دخل: '+fmtDay(p.ts)+' · '+(p.months||[]).map(monthLabel).join('، ')+'</span>'+(isAdm?delBtn('pay'+p.id,"deletePay('"+p.id+"')"):'')+'</div>';
    const outLine=p.outAmount?'<small>خرج: '+money(p.outAmount)+(p.outTs?' · فـ '+fmtDay(p.outTs):'')+'</small>':'';
    const btn=(isAdm&&outKey!==p.id)?'<div><button style="margin-top:6px" onclick="outKey=\''+p.id+'\';render()">تسجيل خروج</button></div>':'';
    const frm=(isAdm&&outKey===p.id)?'<div style="margin-top:6px"><label>المبلغ اللي خرج</label><input id="oa" type="text" inputmode="decimal" value="'+(p.outAmount||p.amount)+'"><label>تاريخ الخروج</label><input id="od" type="date" value="'+isoOf(Date.now())+'"><div class="row2"><button class="ok" onclick="saveOut(\''+p.id+'\')">حفظ</button><button onclick="outKey=null;render()">إلغاء</button></div></div>':'';
    return '<div style="padding:8px 0;border-bottom:1px solid #eee">'+head+outLine+btn+frm+'</div>';
  }).join('');
  return '<div class="card"><h3 style="margin-top:0">تسجيل دفعة</h3><label>تاريخ الدفعة (دخول)</label><input id="sp_d" type="date" value="'+isoOf(Date.now())+'"><label>المبلغ بالدرهم</label><input id="sp_a" type="text" inputmode="decimal" value="'+SRC_MONTHLY+'"><label>الشهور اللي خلصها</label>'+boxes.join('')+
  '<div class="err" id="err5"></div><button class="main" style="margin-top:8px" onclick="addPayment()">تسجيل الدفعة</button>'+
  (list?'<h3>كل الدفعات (آخر 30)</h3>'+list:'')+'</div>';
}
function saveRecorder(){const v=$('#sm_r').value;FS.collection('meta').doc('source').set({recorderId:v||null},{merge:true}).then(render).catch(function(e){toast(fbMsg(e))})}
function saveMonthly(){const v=num($('#sm_m').value);if(!(v>0)){toast('أدخل مبلغا صحيحا');return}FS.collection('meta').doc('source').set({monthly:v},{merge:true}).then(render).catch(function(e){toast(fbMsg(e))})}
function addPayment(){
  const a=num($('#sp_a').value),d=$('#sp_d').value,ms=[].map.call(document.querySelectorAll('.sm:checked'),function(x){return x.value});
  if(!(a>0))return $('#err5').textContent='أدخل مبلغا صحيحا';
  if(!d)return $('#err5').textContent='اختار التاريخ';
  if(!ms.length)return $('#err5').textContent='اختار شهرا واحدا على الأقل';
  backend.add('payments',{amount:a,ts:new Date(d+'T12:00:00').getTime(),months:ms}).then(render).catch(fail('err5'));
}
function deletePay(id){backend.del('payments',id).then(function(){delKey=null}).catch(function(e){toast(fbMsg(e))})}
function adminView(){return adminBase()+fixView()}
function darView(me){const isAdm=me.role==='admin',canRec=isAdm||me.id===SRC_RECORDER;return '<h2>الدار آزرو</h2>'+srcCard()+(isAdm?srcSettings():'')+(canRec?srcForm(isAdm):'')+(isAdm?opsForms():'')+'<h3>عمليات الصندوق</h3>'+listBox(db.expenses.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,60).map(expOp),'لا توجد عمليات بعد.')}
function addExpense(){
  const t=$('#et').value.trim(),a=num($('#ea').value);
  if(!t)return $('#err1').textContent='أدخل البيان';
  if(!(a>0))return $('#err1').textContent='أدخل مبلغا صحيحا';
  backend.add('expenses',{type:'expense',title:t,amount:a,ts:Date.now()}).then(render).catch(fail('err1'));
}
function addLoan(){
  const id=$('#lm').value,a=num($('#la').value);
  if(!(a>0))return $('#err2').textContent='أدخل مبلغا صحيحا';
  backend.add('expenses',{type:'loan',title:'سلفة لـ '+nameOf(id),memberId:id,amount:a,ts:Date.now()}).then(render).catch(fail('err2'));
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function render(){
  const el={set innerHTML(h){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';const ib=(window.__dp&&!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))?'<div class="card" style="text-align:center"><button class="main" style="margin-top:0" onclick="doInstall()">'+(LANG==='ar'?'تثبيت التطبيق على التيليفون':'Installer l\'application sur le téléphone')+'</button></div>':'';$('#app').innerHTML=tr(ib+h)}};
  if(!FIREBASE_CONFIG.apiKey){el.innerHTML=configView();return}
  if(boot==='loading'){el.innerHTML=loadingView();return}
  if(boot==='out'){el.innerHTML=mode==='setup'?setupView():loginView();return}
  if(boot==='nouser'){el.innerHTML=nouserView();return}
  const me=cur();
  if(!me){el.innerHTML=loadingView();return}
  const tabs=[['home','الرئيسية'],['month','الشهر'],['pay','المساهمة'],['dar','الدار آزرو'],['members','الأعضاء']];
  if(me.role==='admin')tabs.push(['admin','الإدارة'+(pendN()?' ('+pendN()+')':'')]);
  if(!tabs.some(t=>t[0]===tab))tab='home';
  const views={home:homeView,month:monthView,pay:payView,dar:darView,members:membersView,admin:adminView};
  el.innerHTML='<header><span style="display:flex;align-items:center;gap:8px">'+LOGO(28)+'<b>الصندوق المشترك</b></span><button class="link" onclick="toggleLang()">'+(LANG==='ar'?'Français':'العربية')+'</button><button class="link" onclick="logout()">خروج ('+esc(me.name)+')</button></header><main>'+views[tab](me)+'</main><nav>'+tabs.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</nav>';
}
if(FIREBASE_CONFIG.apiKey){backend.init();backend.onAuth(onAuth)}
render();
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__dp=e;render()});
window.addEventListener('appinstalled',function(){window.__dp=null;render()});
</script>
</body>
</html>
